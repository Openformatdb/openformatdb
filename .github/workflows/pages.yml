name: Deploy site
on:
  push:
    branches: [main]
  # Snapshot commits made by the import workflow do not trigger `push` (GITHUB_TOKEN).
  workflow_run:
    workflows: ["Import sources"]
    types: [completed]
  schedule:
    - cron: "41 */12 * * *" # expired claims drop off
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run validate
      - run: npm run build
      # Needs Settings → Pages → Source: GitHub Actions (the workflow token cannot turn Pages on).
      - uses: actions/configure-pages@v5
      # Same as actions/upload-pages-artifact, minus its dotfile exclusion: the site serves
      # /.well-known/mcp-registry-auth (MCP Registry domain verification).
      - name: Package site
        run: tar --dereference --hard-dereference --directory site/dist -cf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .
      - uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
