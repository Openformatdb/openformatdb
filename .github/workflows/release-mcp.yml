name: Release MCP server
# Publishes @openformatdb/mcp to npm, then packages/mcp/server.json to the MCP Registry.
# Bump the version in packages/mcp/package.json, server.json and src/server.ts first.
# npm: trusted publishing (OIDC) from this workflow, configured on npmjs.com for
# @openformatdb/mcp; no npm token is stored. MCP Registry: secret MCP_REGISTRY_PRIVATE_KEY
# (hex ed25519 key whose public half is served at
# https://openformatdb.org/.well-known/mcp-registry-auth). Without it, only npm runs.
on:
  workflow_dispatch:
    inputs:
      registry_only:
        description: "Skip npm (this version is already there) and only publish to the MCP Registry"
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write # npm trusted publishing and provenance
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm, registry-url: "https://registry.npmjs.org" }
      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5.1
      - run: npm ci
      - run: npm test
      - name: Check versions agree
        run: |
          v=$(node -p "require('./packages/mcp/package.json').version")
          node -e "const s=require('./packages/mcp/server.json'); if (s.version!=='$v'||s.packages[0].version!=='$v') process.exit(1)"
          grep -q "version: \"$v\"" packages/mcp/src/server.ts
      # Build first: npm reads the manifest before prepublishOnly runs, and drops a `bin` whose file
      # does not exist yet ("script name dist/server.js was invalid and removed").
      - if: ${{ !inputs.registry_only }}
        run: npm run build -w @openformatdb/mcp
      - if: ${{ !inputs.registry_only }}
        name: Check the tarball keeps the bin
        run: cd packages/mcp && npm pack --dry-run --json | node -e "const j=JSON.parse(require('fs').readFileSync(0)); const p=Array.isArray(j)?j[0]:(j.files?j:Object.values(j)[0]); if(!p||!p.files.some(f=>f.path==='dist/server.js')) process.exit(1)" && node -p "require('./package.json').bin['openformatdb-mcp']"
      - if: ${{ !inputs.registry_only }}
        run: npm publish -w @openformatdb/mcp --provenance --access public
      - name: Publish to the MCP Registry
        env:
          KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "MCP_REGISTRY_PRIVATE_KEY not set: skipped"; exit 0; fi
          # What the registry will see: GitHub Pages wants A records to 185.199.108-111.153 only, no AAAA
          # elsewhere, and a CAA (if any) allowing letsencrypt.org; the TXT is the DNS-proof fallback.
          for t in A AAAA CAA TXT; do echo "$t: $(dig +short openformatdb.org $t | tr '\n' ' ')"; done
          echo "TLS: $(echo | openssl s_client -connect openformatdb.org:443 -servername openformatdb.org 2>/dev/null | openssl x509 -noout -subject -issuer 2>/dev/null | tr '\n' ' ')"
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          # HTTP proof (https://openformatdb.org/.well-known/mcp-registry-auth), else the same record as DNS TXT.
          ./mcp-publisher login http --domain openformatdb.org --private-key "$KEY" \
            || ./mcp-publisher login dns --domain openformatdb.org --private-key "$KEY"
          cd packages/mcp && ../../mcp-publisher publish
